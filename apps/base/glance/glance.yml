pages:
  - name: Startpage
    width: slim
    hide-desktop-navigation: true
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Europe/Amsterdam
                label: Amsterdam
              - timezone: America/New_York
                label: New York
              - timezone: America/Asuncion
                label: Paraguay

          - type: search
            autofocus: true

          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Jellyfin
                url: https://yourdomain.com/
                icon: si:jellyfin
              - title: Gitea
                url: https://yourdomain.com/
                icon: si:gitea
              - title: qBittorrent # only for Linux ISOs, of course
                url: https://yourdomain.com/
                icon: si:qbittorrent
              - title: Immich
                url: https://yourdomain.com/
                icon: si:immich
              - title: AdGuard Home
                url: https://yourdomain.com/
                icon: si:adguard
              - title: Vaultwarden
                url: https://yourdomain.com/
                icon: si:vaultwarden

          - type: bookmarks
            groups:
              - title: General
                links:
                  - title: Linkding
                    url: https://linkding.tenrokhomelab.org/
                  - title: Zabbix Monitoring
                    url: https://sombra.tenrok.online/zabbix/
                  - title: Github
                    url: https://github.com/

              - title: Entertainment
                links:
                  - title: Tweakers.net
                    url: https://www.tweakers.com/
                  - title: Prime Video
                    url: https://www.primevideo.com/
                  - title: Disney+
                    url: https://www.disneyplus.com/

              - title: Social
                links:
                  - title: Reddit
                    url: https://www.reddit.com/
                  - title: Twitter
                    url: https://twitter.com/
                  - title: Instagram
                    url: https://www.instagram.com/

          - type: rss
             title: News
             style: horizontal-cards
             feeds:
             - url: https://feeds.bloomberg.com/markets/news.rss
               title: Bloomberg
             - url: https://moxie.foxbusiness.com/google-publisher/markets.xml
               title: Fox Business
             - url: https://moxie.foxbusiness.com/google-publisher/technology.xml
               title: Fox Business
