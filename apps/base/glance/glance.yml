pages:
  - name: Startpage
    width: slim
    hide-desktop-navigation: true
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Europe/Amsterdam
                label: Amsterdam
              - timezone: America/New_York
                label: New York
              - timezone: America/Asuncion
                label: Paraguay

          - type: search
            autofocus: true

          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Zabbix
                url: https://sombra.tenrok.online/zabbix
                icon: sh:zabbix
              - title: HestiaCP
                url: https://vps-e234faf0.vps.ovh.net/
                # icon: si:gitea
              - title: Blog Website
                url: https://blog.tenrok.nl
              - title: Homepage
                url: https://tenrok.nl

          - type: bookmarks
            groups:
              - title: General
                links:
                  - title: Linkding
                    url: https://linkding.tenrokhomelab.org/
                  - title: Zabbix Monitoring
                    url: https://sombra.tenrok.online/zabbix/
                  - title: Github
                    url: https://github.com/
                  - title: Unifi Controller
                    url: https://unifi.ui.com/

              - title: Jobs
                links:
                  - title: Arenella-ict
                    url: https://www.arenella-ict.com/listing
                  - title: Prime Video
                    url: https://www.primevideo.com/
                  - title: Disney+
                    url: https://www.disneyplus.com/

              - title: Learning
                links:
                  - title: Kodekloud
                    url: https://learn.kodekloud.com/learn/dashboard
                  - title: Kubecraft
                    url: https://www.skool.com/kubecraft
                  - title: Next Level Freelancer
                    url: https://nextlevelfreelancer.circle.so/c/cafe

          - type: rss
            title: Security Advisories
            style: vertical-list
            feeds:
              - url: https://advisories.ncsc.nl/rss/advisories
                title: NCSC Advisories

          - type: rss
            title: News
            style: vertical-list
            feeds:
              - url: https://tweakers.net/feeds/nieuws.xml
                title: Tweakers
              - url: https://feeds.ncsc.nl/nieuws.rss
                title: NCSC News
