apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: glance
  name: glance
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      containers:
      - image: glanceapp/glance:v0.8.7
        name: glance
        ports:
          - containerPort: 9090

        volumeMounts:
            - name: config
              mountPath: /app/config/glance.yml

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: glance-data-pvc

        # Create a config.yaml file from the ConfigMap below.
	      - name: config
	        configMap:
	          name: glance
	          items:
	          - key: glance.yaml
	            path: glance.yaml
