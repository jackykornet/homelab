apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glance
spec:
  ingressClassName: traefik
  rules:
    - host: glance.tenrokhomelab.org
      http:
        paths:
          - backend:
              service:
                name: glance
                port:
                  number: 9092
            path: /
            pathType: Prefix
