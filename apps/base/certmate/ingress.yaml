apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: certmate
spec:
  ingressClassName: traefik
  rules:
    - host: certmate.tenrokhomelab.org
      http:
        paths:
          - backend:
              service:
                name: certmate
                port:
                  number: 9093
            path: /
            pathType: Prefix
